const CHEM={"extra":{"botany":{"title":"Botany","blocks":[{"p":"A botanist serves more than just Chef, they also need to make plants for orders, and medical reagents for medical, and biomass for science and medical.","mono":false,"h":false},{"p":"This guide unveils deeper game mechanics that are typically intended to be discovered through roleplay, you have been warned!","mono":false,"h":false},{"p":"Read the full guide of starlight botany in-game first. The rest of this guide assumes you have this knowledge","mono":false,"h":false},{"p":"Here are some game mechanics to keep in mind:","mono":false,"h":false},{"p":"Examining (Shift Click) seeds shows the Yield (how many plants are produced) and Potency (the plant size + quantity of reagents inside it)","mono":false,"h":false},{"p":"Composting adds nutrients puportional to the potency and adds the chemicals in the plant to the tray to metabolize overtime","mono":false,"h":false},{"p":"Hydroponic Trays process chemicals at 1u every 3 seconds.","mono":false,"h":false},{"p":"Sampling seeds damage the plant, and the seeds inherit the health and traits of the original plant.","mono":false,"h":false},{"p":"Biomassing plants converts the Nutriment chemical at a 1:1 rate to biomass.","mono":false,"h":false},{"p":"Animals breed occasionaly when not hungry, thirsty, incapacitated, gestating, an infant, or at population capacity within a 3 tile radius.","mono":false,"h":false},{"p":"Chickens cap at 12, Cows at 6, Pigs at 8","mono":false,"h":false},{"p":"MUTATIONS","mono":false,"h":true},{"p":"Mutations occur every 15 seconds as mutation energy (a hidden stat up cappped at 25) is spent. Using mutagen adds 1 mutation energy per 1u, unless multiplied","mono":false,"h":false},{"p":"Plants start with a mutation rate of 1. This is a per-plant stat, it cannot be swabbed or inherited. Mutation rate multiplies the effect of mutation chemicals up to 3x","mono":false,"h":false},{"p":"Mutations all have a base chance to roll that is multiplied by the mutation energy. Every mutation is rolled in the 15 second batch, then mutation energy resets to 0.","mono":false,"h":false},{"p":"SWABBING","mono":false,"h":true},{"p":"Swabs copy the traits of the plant it swabs (even if it is dead) then has a 50% chance to paste each of the copied traits to the next plant it swabs.","mono":false,"h":false},{"p":"Because swabs copy the traits of the plant every use, it's recommended to use each swab a single time to preserve the initial plant traits you want to copy.","mono":false,"h":false},{"p":"Swabing useful chemicals to plants that are innately multi-harvest like lemon/lime/bananas is recommended to decrease overall harvest time","mono":false,"h":false},{"p":"Transformation through mutation adds (not replaces) guaranteed chemicals, allowing you to swab yield, potency, and useful chemicals prior to transforming.","mono":false,"h":false},{"p":"Prioritize medicinal and flour chemicals, and cargo-related plants while creating a healthy stockpile of biomass:","mono":false,"h":false},{"table":[["Useful Plants","Usecase","Demand","Department","Yield | Potency","To Robust to 50"],["Aloe","Aloe chemical, or rarely used for meshes (3u @50 potency via 14u Robust, so make a lot!).","Very High","Med","3|10","14u Robust"],["Soybean (transform)","Transforms into Koibean for the Carpotoxin chemical (3u @50 potency by swabbing 50 potency before transforming to koi)","Very High","Med","3|10","Swab"],["Galaxythistle","Stelli chemical (13.5u @50 potency via 14u Robust). Occasionally a cargo bounty","High","Med, Cargo","3|10","14u Robust"],["Lingzhi","Ultravasc & Epi chemical. (11u @50 potency via 14u Robust). Can be used as a mushroom replacement for more 'trays'","High","Med","3|10","14u Robust"],["Apple","Biomass (6u Nutriment @50 potency via 14u Robust), Occasionally a cargo bounty","High","Service, Med, Sci","3|10","14u Robust"],["Cocoa","Yield 6 plant (use 17u Robust to get to 50 potency)","High","Service","6|1","17u Robust"],["Tomato","Often a chef request, great to swab other chemicals or 6 yield traits to since it's a multi-harvest plant, prone to spacing explosions","High","Service","2|10","Swab"],["Wheat","Flour chemical (?u @50 potency via 14u Robust), nichely transforms into Meatwheat for chef requests","High","Service","3|10","14u Robust"],["Bungo (exotic seed)","Alternative to Apple, Biomass (7u Nutriment @50 potency via 14u Robust), but rare since it requires ordering an exotic seed crate","Medium","Service, Med, Sci","3|?","14u Robust"],["Tower Cap","Creates Wood, useful for more 'trays' with mushrooms, nichely used to remove chemicals from plants via swabs","Medium","Service","5|1","Swab"],["Chanterelle","Can be used as a mushroom replacement for more 'trays' at a yield of 5","Medium","Service","5|10","Swab"],["Poppy","Transforms into Lily then Trumpets for Poly chemical, or rarely just as poppy for sutures. Occasionally a 'flower' cargo bounty","Medium","Med, Cargo","3|10","Swab"],["Banana","Often a cargo bounty, chef, and clown request, great to swab 6 yield to, nichely helpful to generate Potassium for chem via jucing.","Medium","Cargo, Med","2|10","Swab"],["Lime","Often a cargo bounty, great to swab other chemicals or trait to since it's a multi-harvest plant","Medium","Cargo","3|10","Swab"],["Lemon","Often a cargo bounty, great to swab other chemicals or trait to since it's a multi-harvest plant","Medium","Cargo","3|10","Swab"],["Chili","Often a chef request, great to swab other chemicals or trait to since it's a multi-harvest plant","Medium","Service","2|20","Swab"],["Ambrosia","Transforms into Deus that has the Omni chemical (Primarily used for Ambuzol+ zombie cure, not as a best in slot healing chemical)","Medium","Med","3|10","Swab"],["Carrots","Usually a cargo request or occasionally a passernger request for the Occuline chemical","Low","Cargo","3|10","Swab"],["Pumpkin","Transforms into Blue Pumpkin that has the Ammonia chemical, nichely helpful to generate Chlorine an ng this tool you can reliably mutate, manage health, and swab chemicals to plants without waiting to harvest or for alarms Tip! You can compost 15u+ of Flour, then add water to the tray to create Dough for the Chef while upping your tray's nutri and water levels"},"machinechems":{"title":"Machine chems","blocks":[{"p":"In SS14, you can obtain chemicals through an Electrolyzer, Condenser, Grinder, and Centrifuge","mono":false,"h":false},{"table":[["","Grinder","Condenser","Centrifuge","Electrolyzer"],["Oxygen","Coal / Steel / Glass","Canister (o2, air)","","Water"],["Carbon","Coal / Cables / Steel","Canister (co2)","Fiber / Vitamin","Protein"],["Hydrogen","Coal","Canister (?)","Welding Fuel","Water"],["Phosphorus","Plastic / Flare","","","Protein"],["Sugar","","","Blood / Fiber","Cellulose Fibers"],["Nitrogen","","Canister (nitro, air)","Vitamin",""],["Sodium","","","","Table Salt"],["Chlorine","BPumpkin","","","Table Salt"],["Copper","Cables","","",""],["Iron","Cables / Ore / Glass","","",""],["Potassium","","","Banana Juice",""],["Sulfur","Coal / Flare","","Welding Fuel",""],["Radium","Uranium ore","","",""],["Silicon","Glass","","",""],["Ethanol","","","Welding Fuel",""],["Ammonia","Coal / BPumpkin","Scrubber Corpses","",""],["Cellulose Fibers","Wood","","",""],["Carbon Dioxide","","","Blood",""],["Protein","Meats","","",""],["Table Salt","Salt Ore","","",""],["Plasma","Plasma / Plasteel","","",""]],"head":true},{"p":"Certain useful chemicals can not be obtained through machines and must be found instead;","mono":false,"h":false},{"table":[["Welding Fuel","Welding tools / Tanks","Used to get Sulfur and Ethanol, used in Phal / Robust / Tranex"],["Lithium","Jug / Vend / Pills","Used to get Bruizine / Space Mirage"],["Potassium (ish)","Artifacts / Bananas","Used to get Arith / Botany chems"]],"head":false},{"p":"Here's what you need to get each of the basics that's Generally easy to obtain;","mono":false,"h":false},{"table":[["BIC","Wood & Water & Coal"],["BRUIZE","N/A - Lithium !"],["LACE","Coal & Water"],["PUNCT","Water"],["DEXP","Water & Steel & Plasma"],["SALINE","Salt"],["ARITH","Air & Glass & Bananas"],["PHAL","N/A - Welding Fuel ! & Salt & Air & Glass & Bananas & Plastic"],["DYLO","Air & Glass & Bananas"],["DERMA","Plastic & Coal & Glass"],["LEPO","Glass & Cables & Plasma"],["PYRA","Glass & Cables & Coal & Plasma"],["INSUZ","Glass & Cables & Coal & Plasma"],["SIGY","Salt & Glass & Cables & Coal & Wood & Water (just use Siderlac tbh)"]],"head":false}],"tips":""},"plumbing":{"title":"Plumbing","blocks":[{"p":"Read the full guide of starlight plumbing in-game first. The rest of this guide assumes you have this knowledge","mono":false,"h":false},{"p":"Prioritize making chemicals before plumbing anything.","mono":false,"h":false},{"p":"If one is not present, create and link a system to a Plumbing Fridge and Chem Master after the initial set of chemicals are created. From there, make the refiils manually before setting up complicated automation.","mono":false,"h":false},{"p":"It is typically far faster for you to manually create chems to refill fridges than setup a plumbing system. Unless you plan to leave chemistry, make the refills manually until you have free time.","mono":false,"h":false},{"p":"Key understandings:","mono":false,"h":false},{"p":"Plumbing is Pull-based, meaning reagents do not flow through pipes like air in gas pipes. Instead reagents sit in the machines and buffers and are pulled at 20u / 2 seconds","mono":false,"h":false},{"p":"The containers in the machines can get clogged very easily by producing too many of the incorrect reagent. Using filters avoids this, but keep in mind you cant chain a filter on a filter. Chaining filters makes the second filter only see the reagents in the buffer of the first filter, which is prone to clogging with base reagents.","mono":false,"h":false},{"table":[["Configuration for one reactor system that makes Bic and Derm for menders (clogs)","Chems Made","Temp Set"],["5 Carbon, 3 Oxygen, 1 Sugar, 2 Phosphorus, 1 Silicon","Bic + Derm","293K"]],"head":true},{"p":"Configurations for a system using reactors that have multiple output chemicals (prone to clogs)","mono":false,"h":false},{"table":[["6 Carbon, 3 Oxygen, 1 Sugar, 2 Phosphorus, 2 Silicon","Bic + Derm + Kelo","293K"],["2 bic, 1 hydrogen, 1 oxygen, 1 kelotane, 1 Lepo, 1 Silicon","Punct + Insuz","450K"],["1 Plasma, 3 carbon, 5 Iron, 2 Silicon, 4 Copper, 2 Oxygen","Dexp + Lepo","350K"],["1 Bic, 1 Hydrogen, 2 Carbon, 1 Lepo, 1 Derm","Lace + Pyra","560K"]],"head":false},{"p":"Configurations for a system using a reactor for each output chemical (does not ever clog)","mono":false,"h":false},{"table":[["20 bic, 20 hydrogen, 20 carbon","Lace","350K"],["20 bic, 10 hydrogen, 10 oxygen","Punct","350K"],["40 carbon, 10 oxygen, 10 sugar","Bic","293K"],["10 carbon, 20 oxygen, 20 phosphorus, 10 silicon","Derm","293K"],["10 plasma, 30 carbon, 30 iron, 20 oxygen","Dexp","293K"],["1 plasma, 20 iron, 20 silicon, 40 copper","Lepo","350K"],["20 derm, 20 carbon, 20 lepo","Pyra","560K"],["10 carbon, 30 silicon, 20 lepo","Insuz","450K"]],"head":false},{"p":"Ideally filter what you put into the fridge to prevent contraband chemicals like Phosphorus and Silicon from entering it.","mono":false,"h":false},{"p":"Ensure you have an input in the system to add the initial plasma necessary for Lepo and Dex+ reactors.","mono":false,"h":false},{"p":"Further expanding the system and manually adding chemicals like Salt, Lithium, Nitrogen and Potassium allows for nearly all useful chemicals to be made. This is not recommended as it is far faster to create those by hand using the dispenser and chem master instead.","mono":false,"h":false},{"p":"Creating visible sinks for Bic and Derm near the cryostasis beds is recommended for new doctors to easily understand how to refill and use automenders.","mono":false,"h":false},{"p":"A round-start system to connect to a fridge to create Bic, Derma, Lace and Punct (not optimal)","mono":false,"h":false},{"p":"Optimal plumbing setups will require you to use the synths as the piping.","mono":false,"h":false},{"p":"The smallest 8 reactor builds only need 4x5 tiles:","mono":false,"h":false},{"p":"├ X ┼ X ┤                 ├ X ┼ X ┤","mono":true,"h":true},{"p":"├ X ┼ X ┤                 ┴ ┴ ┴ ┴ ┴","mono":true,"h":true},{"p":"├ X ┼ X ┤                 ^ Bic and Derm","mono":true,"h":false},{"p":"├ X ┼ X ┤","mono":true,"h":true},{"p":"Due to the nature of this, you can also have the middle piping ┼ effectively by a walkable path to reach all synths and reactors","mono":true,"h":false},{"p":"However, station layouts often do not have room for this. Some layout options include:","mono":false,"h":false}],"tips":"Tip! Use this shorthand when setting up reactors! as = plasma xy = oxygen ar = carbon & bicardine ga = sugar hy = hydrogen er = copper & dermaline ro = iron us = phosphorus si = silicon le = lepo"},"notes":{"title":"Notes","blocks":[{"table":[["What is Master Dump?","Why?"],["Click and drag jugs or beakers directly into a Chem Master to quickly move the liquids inside.\n \nIt works like a Janitor would use a Drain to dump liquids.","This makes it easier to maintain your understanding of what beaker is hot and cold by not ejecting the hot beaker from the Chem Master"]],"head":true},{"table":[["How does heat work?","What's a reductive mixture?"],["Heat doesn't change over time and a beaker will maintain its heat indefinitely until liquid is put in a beaker or there is a reductive mixture. \n\nMoving liquids between beakers will maintain the heat in the new beaker as long as it is empty. If the beaker already had liquid then the temp will combine between the liquids that are mixed together.","When you make a chemical that reduces the overall units of the liquid, the heat increases. Conceptually, the same amount of heat is just being shared among fewer units; an exothermic reaction. \n\nHowever, this change of temp can occur in the Chem Master and be maintained, making beakers really hot really easily over the course of the chem order, starting with Benzene."]],"head":true},{"p":"Note this is for beaker usage. Jug mixing is also very fast, stop at line 12 and simply put the reagents in different jugs, 30u at a time.","mono":false,"h":false},{"table":[["Advanced Diph Notes:","Why?"],["Start with two empty beakers","We'll use one beaker to maintain a heat between 377K and 540K while the other mixes stuff together and changes heat."],["Make beaker one cold","You can reset by dispensing room temp liquid into an empty beaker"],["Put in 5u of any liquid (oil) in beaker one","Oil can make it easy to tell if it's too hot when you dont have goggles"],["Heat for 4-5 seconds","If you ash the oil around 540K you've gone too far, reset the process."],["Transfer the liquid from beaker one to beaker two","Transfering the liquid will make both beakers have the same heat, regardless of their previous heat value."],["Put beaker two in the Chem Master and mix Diph (20u oil, carbon, salt, dieth, ethanol)\n\nEnsure the last 20u that completes the mixture is put in all at once.","Because this is a reductive mixture it will heat the beaker and ash the remaining oil (which turns into charcoal) if it is not all mixed at the same time\n\nIf you have an odd mixture as a result of putting in less than 20u, empty all the chemicals back in the master and continue the process. You'll end with less Diph."]],"head":true},{"p":"Dump the Diph in the Chem Master","mono":false,"h":false},{"table":[["Eject beaker two and hold in hand","We'll need to use beaker one to reset the heat below 540K again"],["Put the empty beaker one in the Chem Master and Extract any liquid","The Chem Master will maintain the heat of the beaker even if it started with no liquids. \nWe can pull this out to normalize the temp again"]],"head":false},{"p":"Eject beaker one and transfer the liquid from beaker one to beaker two","mono":false,"h":false},{"p":"Repeat the process 3]ANDOY|Anesthsia @ 10u"}],"block":null},{"id":"Omu Sector","items":[{"t":"ARTI|Bloodloss|50/5u|11OD"},{"t":"OXA|BURN|40/5u>30dmg|25OD"},{"t":"TIRI|Airloss|60/5u|11OD"},{"t":"SALI|BRT|40/5u>30dmg|25OD"},{"t":"PENT|Poison+Rad|40/5u"},{"t":"RHYM|Cellular|15/5u|11OD"},{"t":"IMMURINE|Immunity+"},{"t":"SPACEAC|Bacterial- Immunity-"},{"t":"DEVIRATE|Viral-"},{"t":"CHARCOAL|CleanBld|Use5u"},{"t":"OCULINE|Eyesight|Use5u"}],"block":null}],"howto":["For some servers, you can copy the entire","list of labels and adjust your local files","to import all of the labels at once time.","Navigate to:","%appdata%/Space Station 14/data/client_config.toml","or for linux, probably",".local/share/Space Station 14/data/client_config.toml","find [interface] and replace the entire block","of text below it with the following:","CATEGORY LABELS"],"silver":{"intro":["Hi! I'm Licks-the-Vials. This is a workflow guide optimized to aspiring chemists for starlight for 120u beakers.\n                       \n                       I recommend to coordinate with your fellow chemists to divide resources and complete the full workload. \n                       This means claiming categories of chemicals BEFORE you start working, even though we need to be fast!\n                       \"Brigmed Chems\" mean a set of the colored reagents for Basic & Airloss Tier 1s and Brute, Burn, Toxin Tier 2s \n                       \n                       Your beaker retains heat, there is no need to re-heat it for every recipe, you can heat it quickly with 1u on a hotplate\n                       Reductive reactions (bruizine, acetone) also heat your beaker, while reductive reactions (dex) cool it.\n                       You can also cool your beaker by adding room tempature, non generated chems from the dispenser, or water/welding fuel.\n                       \n                       Shorthand Key: (DM) = Dispenser Mix  |  (CMD) = Chem Master Dump  |  (MIM) = Mix in Master  |  (JM) = Jug Mix","This is a workflow guide intended to optimize the speed of producing a base set of useful chemicals.\n \nThis is optimized for a Silver Beaker (150u capacity) and without dumping Jugs from the Chem Dispenser.\n\nStart with a syringe and siphon 90u of your blood into an empty jug whilst simultaneously dispensing these jugs:\n\n3 Empty, 2 Carbon, 1 Chlorine, 1 Copper, 2 Hydrogen, 1 Iron, 2 Oxygen, 2 Silicon\n\nMaster Dump the Plasma vial and Carbon, Hydrogen, Oxygen, Silicon, Copper jugs, then proceed. You can put this paper in your pocket for easy viewing.\n\nShorthand Key: \n(DM) = Dispenser Mix\n(CMD) = Chem Master Dump\n(MIM) = Mix in Master  \n(JM) = Jug Mix\n\n[head=2]Start Mixing Here[/head]\n\n[bold]DYLO - DM[/bold]\n30 Silicon, 30 Potassium, 30 Nitrogen, Twice → Jug\n\n[bold]DERM - DM[/bold]\n20 Silicon, 20 Carbon, 40 Oxygen, 40 Phosphorus, Twice → Jug & CMD overfill\n\nPrep for Later... - CMD \n90 Lithium, 140 Sodium\n\n30 Derm for Later... DM\n5 Silicon, 5 Carbon, 10 Oxygen, 10 Phosphorus → CMD\n\nAmmonia - DM\n75 Hydrogen, 25 Nitrogen, Twice → CMD\n\nPrep for Later... - CMD \n60 Iron 140 Sugar\n\n[bold]BIC - DM[/bold]\n80 Carbon, 20 Oxygen, 20 Sugar, Four Times → CMD\n\n[bold]BRUIZ - MIM[/bold]\n50 Bicardine, 50 Sugar, \"\"50\"\" Lithium, Twice → Jug\n\n[bold]ARITH - DM[/bold]\n15 Silicon, 15 Potassium, 15 Nitrogen, 45 Radium, → Jug, 90 Hydrogen → Jug\n\nHEAT your beaker!\n1u of anything for 5 seconds on a hot plate. The rest of the order assumes a Hot beaker\n\n[bold]AMOX - MIM[/bold]\n50 Carbon, 50 Iron, 50 Ammonia, Twice\n\nBenzene - MIM\n50 Hydrogen, 50 Carbon, Twice → Jug\n\nHydroxide - MIM\n50 Hydrogen, 50 Oxygen → Jug\n\n[bold]LACE - MIM[/bold]\n100 Bicardine, 100 Benzene\n\n[bold]PNCT - MIM[/bold]\n100 Bicardine, 100 Hydroxide\n\nFerscilite - MIM\n50 Iron, 50 Silicon, Twice\n\n[bold]LEPO - MIM[/bold]\n1 Plasma, 50 Fersilicite, 50 Copper, Four Times\n\nDexaline - MIM\n1 Plasma, 40 Oxygen\n\n[bold]DEXP - JM[/bold]\n60 Dexalin, 60 Carbon, 60 Iron → Jug\n\nPrep for Later... CMD\n200 Chlorine from Jug\n\nSalt - MIM \n100 Sodium, 100 Chlorine\n\n[bold]SALINE - JM[/bold]\n40 Salt, 160 Water → Jug\n\nSodium Carb - MIM\n10 Ammonia, 10 Salt, 10 Carbon, 10 Oxygen → Jug\n\nSodium Hydroxide - MIM\n10 Hydrogen, 10 Oxygen, 20 Sodium → Jug\n\n[bold]SIGY - JM[/bold]\n40 Sodium Carbonate, 40 Sodium Hydroxide, 20 Silicon, 20 Carbon, 40 Sugar, 40 Water\n\n[bold]PYRA - JM[/bold]\n60 Leporazine, 60 Dermaline, 60 Carbon → Jug\n\n[bold]INSUZ - JM[/bold]\n60 Leporazine, 30 Carbon, 90 Silicon → Jug\n\n[bold]TRIC - DM[/bold]\n30 Oxygen, 30 Carbon, 30 Sugar → Jug   30 Silicon, 30 Potassium, 30 Nitrogen → Jug\n\n[head=2]Welding Fuel Chem[/head]\n\nCOOL your beaker!\nAny cool liquid, Welding Fuel is great for this. Grab at least 75 Fuel and CMD\n\nPrep for Later... CMD \n200 Carbon & Oxygen & Ethnaol from a new Jug or the Dispenser. Dispense 5 additional jugs.\n\nOil (@520k Oil Ashes) - MIM\n50 Welding Fuel, 50 Hydrogen, 50 Carbon\n\nWARM your beaker\nSpecifically use 5u Oil and heat between 400K and 500K (4 seconds on the hot plate)\n\n[bold]DIPH - JM[/bold]\n20 Ammonia, 60 Ethanol, 40 Oil, 40 Salt → Jug THEN 40 Carbon → Jug \n\nEphedrine - MIM\n10 Oil, 5 Ammonia, 5 Ethanol, 10 Hydrogen, 10 Sugar\n\nAcetone - MIM\n25 Oil, 25 Welding Fuel, 25 Oxygen\n\nPhenol - MIM\n50 Hydrogen, 25 Carbon, 25 Oxygen\n\nHydroxide - MIM\n25 Hydrogen, 25 Oxygen\n\n[bold]EPI - JM[/bold]\n50 Phenol, 50 Acetone, 50 Chlorine, 50 Hydroxide → Jug\n\n[bold]OCULINE - MIM[/bold]\n20 Salt, 20 Blood, 20 Hydrogen, 20 Oxygen \n\n[head=2]Cryo Chem+[/head]\n\nPrep for later... CMD\n150 Water (if not from earlier), 30 Phosphorus, 30 Radium, 60 Lithium, 10 Sugar\n\nTricordine - DM\n10 Carbon, 10 Oxygen, 10 Sugar, THEN 10 Silicon, 10 Potassium, 10 Nitrogen → MD\n\nHEAT your beaker!\n1u of anything for 5 seconds on a hot plate. The rest of the order assumes a Hot beaker\n\nDexalin - MIM\n1 Plasma, 50 Oxygen, Twice\n\n[bold]CRYOX - MIM[/bold]\n50 Dexalin, 50 Oxygen, 50 Water, Thrice (Jug 180)\n\nMutagen - MIM \n30 Chlorine, 30 Phosphorus, 30 Radium\n\n[bold]DOXA - JM[/bold]\n90 Cryoxadone, 90 Mutagen → Jug \n\n[bold]ARCRYO - JM[/bold]\n60 Cryoxadone, 60 Lithium, 60 Tricordine → Jug \n\nDeso - MIM\nEphedrine, Carbon, Iodine, Phosphorus\n\n[bold]NECRO - JM[/bold]\n70 Blood, 70 Cryox, 70 Deso, 70 Diph → Jug 110\n\n[bold]CHRON - JM[/bold]\n30 Necro, 60 Cryox, 15 Silicon, 15 Potassium, 15 Nitrogen, 45 Radium, 60 Hydrogen \n\n[bold]ETHYL - JM[/bold]\n15 Silicon, 15 Potassium, 15 Nitrogen, 45 Oxygen, 45 Carbon → Jug \n\n[bold]HALOPER - DM[/bold]\nCOLD BEAKER!  20 Aluminum, 20 Chlorine, 20 Flourine, 20 Oil, 10 potassium, 10 iodide\n\n[bold]CHARCOAL - JM[/bold]\nCarbon, Ash as needed"],"sections":[{"title":"BASIC Tier 1s","desc":"This is the bare minimum you need to do quickly. Use the Jug boxes.","total":"4 jugs","rows":[{"name":":BIC|BRT|15/5u|15OD+MixBRT","how":"80 Carbon, 20 Oxygen, 20 Sugar, Twice → Jug","total":"240","method":"DM","cat":":BIC|BRT|15/5u|15OD+MixBRT","label":":[color=#ffaa00]BIC|BRT|15/5u|15OD+MixBRT","labels":{"Category":":BIC|BRT|15/5u|15OD+MixBRT","Colored":":[color=#ffaa00]BIC|BRT|15/5u|15OD+MixBRT","Meme":":[color=#ffaa00]Cola","OwO":":[color=#ffaa00]bicky(T⌓T)|bwute|15/5u|15od"}},{"name":".DERM|BURN-Caus|20/5u|10OD","how":"20 Carbon, 40 Oxygen, 40 Phosphorus, 20 Silicon, Twice → Jug","total":"240","method":"DM","cat":".DERM|BURN-Caus|20/5u|10OD","label":".[color=#216b85]DERM|BRNnoCaus|15/5u|10OD","labels":{"Category":".DERM|BURN-Caus|20/5u|10OD","Colored":".[color=#216b85]DERM|BRNnoCaus|15/5u|10OD","Meme":".[color=#216b85]Jelly","OwO":".[color=#216b85]dewma(•ω•̥`)|buwn|15/5u|10od"}},{"name":"`DYLO|Poison|10/5u|20OD","how":"40 Silicon, 40 Potassium, 40 Nitrogen, Twice → Jug","total":"240","method":"DM","cat":"`DYLO|Poison|10/5u|20OD","label":"`[color=#bd5902]ARITH|Rads|30/5u|+BRTDmg","labels":{"Category":"`DYLO|Poison|10/5u|20OD","Colored":"`[color=#6853a3]DYLO|Poison|10/5u|20OD","Meme":"`[color=#6853a3]Liquorice","OwO":"`[color=#6853a3]dy return`<section class="fc"><header><h4>${E(title)}${sub?` <span class="m">${E(sub)}</span>`:""}</h4></header><div class="bd pad">${body}${lab}</div></section>`}
function chem(){const type=ctype();LBL_STORE.length=0;
let h=`<div class="cbar"><div class="seg">${Object.entries(CV).map(([k,v])=>`<button type="button" data-cv="${k}" aria-pressed="${chemView==k}">${v}</button>`).join("")}</div>
<select id="lt" aria-label="Label type">${CHEM.types.map(t=>`<option value="${E(t.id)}"${t.id==type?" selected":""}>Labels: ${E(t.id)}</option>`).join("")}</select></div>
<p class="m cred">From <a href="${CHEM_SHEET}" target="_blank" rel="noopener">SS14 Chemistry for Kobolds</a>, the community chemistry sheet by Licks-the-Vials and other Starlight chemists, shared here with permission.</p>`;
if(chemView=="calc")h+=calcHtml(type);
else if(CHEM.extra[chemView])h+=extraHtml(CHEM.extra[chemView]);
else if(chemView=="labels"){const T=CHEM.types.find(t=>t.id==type),items=T.items.filter(x=>x.t);const block=T.block||items.map(x=>x.t).join("\\n");
h+=`<div class="cnote"><details><summary>Load every ${E(type)} label into your hand labeler at once</summary><p class="pre">${E(CHEM.howto.join(" ").replace(/\s+/g," ").replace(/Navigate to:/,"\nNavigate to:\n").replace(/ or for linux, probably /,"\nor for linux, probably\n").replace(/ find \[interface\]/,"\nFind [interface]"))}</p>
<pre class="blk">hand_labeler_saved_labels = "${E(block)}"</pre><button type="button" class="cp" data-copy="${LBL_STORE.push('hand_labeler_saved_labels = "'+block+'"')-1}">Copy config line</button></details></div>
<div class="llist">${T.items.map(x=>x.h?`<h3 class="lh">${E(x.h)}</h3>`:labelRow(x.t)).join("")}</div>`}
else{const G=CHEM[chemView=="gold"?"gold":"silver"],kind=chemView=="gold"?"gold":"guide";
h+=`<div class="cnote"><details><summary>About this guide${kind=="guide"?" and the Nano Task paper version":""}</summary>${G.intro.map((t,i)=>`<p class="pre">${E(t.replace(/^[ \t]+/gm,""))}</p>${kind=="guide"&&i==1?`<button type="button" class="cp" data-copy="${LBL_STORE.push(t)-1}">Copy for a Nano Task paper</button>`:""}`).join("")}
${kind=="guide"?`<p class="pre">${Object.entries(METH).map(([k,v])=>k+" = "+v).join("\n")}</p>`:""}</details></div><div class="grid wide">`;
for(const sec of G.sections){h+=`<div class="csec"><h2>${E(sec.title)}</h2>${sec.total?`<span class="m">${E(sec.total)}</span>`:""}<span class="m">${E(sec.desc)}</span></div>`;
const groups=[];for(const r of sec.rows)r.cont&&groups.length?groups.at(-1).push(r):groups.push([r]);h+=groups.map(g=>stepCard(g,kind,type)).join("")}h+="</div>"}
$("chem").innerHTML=h;$("lt").onchange=e=>{prefs.lt=e.target.value;save("prefs",prefs);chem()};if(chemView=="calc")calcWire()}
// free-form sheet tabs: paragraphs, tables and the odd ASCII diagram
function extraHtml(X){let h=X.tips?`<div class="cnote">${X.tips.split(/\s*Tip! */).filter(Boolean).map(t=>`<p class="blk-p"><b>Tip:</b> ${E(t)}</p>`).join("")}</div>`:"",mono=[];const fl=()=>{if(mono.length){h+=`<pre class="dia">${E(mono.join("\n"))}</pre>`;mono=[]}};
for(const b of X.blocks){if(b.p&&b.mono){mono.push(b.p);continue}fl();
if(b.p)h+=b.h?`<h3 class="blk-h">${E(b.p.charAt(0)+b.p.slice(1).toLowerCase())}</h3>`:`<p class="blk-p pre">${E(b.p)}</p>`;
else{const[hd,...rs]=b.head?b.table:[null,...b.table];h+=`<div class="tbw"><table class="tb">${hd?`<thead><tr>${hd.map(c=>`<th>${E(c)}</th>`).join("")}</tr></thead>`:""}<tbody>${rs.map(r=>`<tr>${r.map(c=>`<td class="pre" style="margin:0">${E(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}}fl();return h}
// reaction calculator: every chemical reaction from the game files, expanded down to dispenser stock
const RXP={};CRX.rx.forEach(r=>r.out.forEach(([id])=>(RXP[id]??=[]).push(r)));
const BADMIX=/Centrifuge|Electrolysis|Holy/,rname=id=>CRX.names[id]||id,fu=u=>+(+u).toFixed(2);
const okRx=r=>!(r.mix||[]).some(m=>BADMIX.test(m));
function pickRx(id){const L=RXP[id]||[];return L.find(r=>okRx(r)&&r.out[0][0]==id)||L.find(okRx)||null}
function plan(id,amt,path=new Set([id]),steps=[]){const r=pickRx(id);if(!r)return steps;const k=amt/r.out.find(o=>o[0]==id)[1];
const ins=r.in.map(([rid,a,cat])=>{const u=cat?a:a*k,made=!cat&&!CRX.src[rid]&&!path.has(rid)&&!!pickRx(rid);let at=0;if(made){plan(rid,u,new Set(path).add(rid),steps);at=steps.length}return{id:rid,u,cat:!!cat,made,at}});
steps.push({id,u:amt,ins,min:r.min,max:r.max,mix:r.mix,also:r.out.filter(o=>o[0]!=id).map(([o,a])=>({id:o,u:a*k}))});return steps}
const CPICK=Object.keys(RXP).filter(id=>pickRx(id)).sort((a,b)=>rname(a).localeCompare(rname(b))),BYNAME={};CPICK.forEach(id=>BYNAME[rname(id).toLowerCase()]=id);
const QUICK=["Bicaridine","Dermaline","Dylovene","DexalinPlus","Saline","Leporazine","Pyrazine","Insuzine","Sigynate","Arithrazine","Bruizine","Lacerinol","Puncturase","Cryoxadone","Doxarubixadone","Necrosol","Epinephrine","Tricordrazine"].filter(id=>RXP[id]);
let calcSel="Bicaridine",calcAmt="";
const autoAmt=id=>{const ok=(T,f)=>plan(id,T).every(s=>s.ins.every(x=>x.cat||f(x.u)));for(const f of[u=>Math.abs(u/5-Math.round(u/5))<1e-9,u=>Math.abs(u-Math.round(u))<1e-9])for(let T=30;T<=240;T+=5)if(ok(T,f))return T;return 30};
const rdot=id=>`<i class="rd" style="--c:${E(CRX.colors[id]||"var(--line)")}" aria-hidden="true"></i>`;
function calcHtml(type){const id=RXP[calcSel]?calcSel:"Bicaridine",T=+calcAmt||autoAmt(id),steps=plan(id,T);
const tot={},cats={};steps.forEach(s=>s.ins.forEach(x=>{if(x.made)return;if(x.cat)cats[x.id]=Math.max(cats[x.id]||0,x.u);else tot[x.id]=(tot[x.id]||0)+x.u}));
const lab=(()=>{const T2=CHEM.types.find(t=>t.id==type);const nm=rname(id).toUpperCase().replace(/[^A-Z]/g,"");const hits=T2.items.filter(x=>x.t).map(x=>x.t).filter(t=>{const k=t.replace(/\[[^\]]*\]/g,"").replace(/^[,;:.`^*~]/,"").split("|")[0].replace(/[^A-Za-z]/g,"").toUpperCase();return k.length>=3&&nm.startsWith(k)});return hits.length==1?hits[0]:null})();
let h=`<div class="calc"><div class="cnote"><div class="cform"><input id="cq" type="search" list="chemlist" placeholder="Find a chemical…" aria-label="Chemical" value="${E(rname(id))}"><datalist id="chemlist">${CPICK.map(i=>`<option value="${E(rname(i))}">`).join("")}</datalist>
<label class="ck">Make <input id="camt" type="number" min="1" max="1000" step="1" placeholder="${T}" value="${E(calcAmt)}" aria-label="Amount in units">u</label><span class="m">${calcAmt?"":"(picked so every amount is a whole number"+(T%5?"":", in 5u steps")+")"}</span></div>
<div class="qp" style="margin-top:8px">${QUICK.map(q=>`<button type="button" class="chip" data-cq="${q}" aria-pressed="${q==id}">${E(rname(q))}</button>`).join("")}</div></div>
<p class="m" style="margin:0">Recipes come straight from the Starlight game files. Each step is its own mix; do them in order, and keep anything you make for the later steps that use it.</p><div class="grid wide">`;
steps.forEach((s,i)=>{const tags=[s.min?`<span class="tag hot">heat above ${fmtT(Math.ceil(s.min))}</span>`:"",s.max?`<span class="tag cold">keep below ${fmtT(Math.floor(s.max))}</span>`:"",...(s.mix||[]).map(m=>`<span class="tag">${E(m=="Shake"?"shake in a shaker":m=="Stir"?"stir with a spoon":m)}</span>`)].join("");
h+=`<section class="fc${i==steps.length-1?" root":""}"><header><span class="snum">${i+1}</span><h4>${rdot(s.id)}Make ${fu(s.u)}u ${E(rname(s.id))}</h4></header><div class="bd pad">${tags?`<div class="row">${tags}</div>`:""}<ul class="ilist">${s.ins.map(x=>`<li>${rdot(x.id)}<b>${fu(x.u)}u</b> ${E(rname(x.id))}${x.cat?` <span class="made">catalyst, not used up</span>`:x.made?` <span class="made">from step ${x.at}</span>`:CRX.src[x.id]?` <span class="made">${E(CRX.src[x.id])}</span>`:` <span class="made">not made by mixing</span>`}</li>`).join("")}</ul>
${s.also.length?`<p class="m" style="margin-top:6px">Also makes ${s.also.map(a=>fu(a.u)+"u "+E(rname(a.id))).join(", ")}</p>`:""}${i==steps.length-1&&lab?labelRow(lab):""}</div></section>`});
h+=`<section class="fc"><header><h4>Everything you need</h4></header><div class="bd pad"><ul class="ilist">${Object.entries(tot).sort((a,b)=>rname(a[0]).localeCompare(rname(b[0]))).map(([k,u])=>`<li>${rdot(k)}<b>${fu(u)}u</b> ${E(rname(k))} <span class="made">${E(CRX.src[k]||"not made by mixing")}</span></li>`).join("")}${Object.entries(cats).map(([k,u])=>`<li>${rdot(k)}<b>${fu(u)}u</b> ${E(rname(k))} <span class="made">catalyst, reusable</span></li>`).join("")}</ul></div></section></div></div>`;return h}
function calcWire(){const go=()=>{const v=$("cq").value.trim().toLowerCase();if(BYNAME[v]&&BYNAME[v]!=calcSel){calcSel=BYNAME[v];calcAmt="";chem();$("cq").focus()}};$("cq").onchange=go;$("cq").oninput=()=>{if(BYNAME[$("cq").value.trim().toLowerCase()])go()};
$("camt").onchange=()=>{const v=Math.round(+$("camt").value);calcAmt=v>0?String(Math.min(v,1000)):"";chem()}}
$("chem").addEventListener("click",e=>{const q=e.target.closest("[data-cq]");if(q){calcSel=q.dataset.cq;calcAmt="";chem();return}const b=e.target.closest("[data-cv],[data-copy]");if(!b)return;
if(b.dataset.cv){chemView=b.dataset.cv;try{history.replaceState(null,"","#chem/"+chemView)}catch(x){}chem();return}
copyText(LBL_STORE[b.dataset.copy],"Copied")});

// tabs
const RENDER={recipes:draw,drinks,chem,combos,menus,list},VIEW={recipes:"grid",drinks:"drinks",chem:"chem",combos:"combos",menus:"menus",list:"list"};
function show(t,keepHash){tab=t;if(!keepHash)try{history.replaceState(null,"","#"+t+(t=="chem"&&chemView!="guide"?"/"+chemView:""))}catch(e){}document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab==t));for(const k in VIEW)$(VIEW[k]).hidden=k!=t;
const searchable=t=="recipes"||t=="drinks";$("bar").hidden=$("n").hidden=!searchable;$("rctl").hidden=t!="recipes";$("batch").hidden=t!="drinks";$("fpanel").hidden=t!="recipes"||$("fb").getAttribute("aria-expanded")!="true";RENDER[t]()}

// steps page: a right-to-left tree of cards
let REG=[],opener=null;
const rootKey=([t,o])=>t=="rx"?"r:"+o.products[0][2]:t=="cut"?"e:"+o.outIds[0]:"e:"+o.result;
// in a build tree, a drink made as an ingredient is scaled to exactly the amount the next step needs
const fit=(way,need)=>{const m=/^([\d.]+)u$/.exec(need||"");if(way[0]!="rx"||!m)return way;const o=way[1],pr=o.products.find(y=>y[0]==way[2])||o.products[0],k=+m[1]/pr[1],r=v=>Math.round(v*k*100)/100;
return["rx",{...o,products:o.products.map(y=>[y[0],r(y[1]),y[2]]),reagents:o.reagents.map(y=>[y[0],r(y[1]),y[2]])}]};
function nodeHtml(way,title,need,path,root,key){way=fit(way,need);const i=REG.push({way,path})-1,kids=inputs(way).some(x=>!path.has(x[0]));
return`<div class="fn" data-i="${i}"><div class="fk" hidden></div><div class="fl" hidden><span>Made with</span><svg width="56" height="10" viewBox="0 0 56 10" aria-hidden="true"><path d="M0 5H54M48 1L54 5L48 9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>${card(way,title,{ctx:"flow",need,root,kids,key})}</div>`}
function expand(n,open){const k=n.querySelector(":scope>.fk"),b=n.querySelector(":scope>.fc .fx");if(!b)return;
if(!k.innerHTML){const{way,path}=REG[n.dataset.i];k.innerHTML=inputs(way).filter(x=>!path.has(x[0])).map(x=>ways(x[0]).map(w=>nodeHtml(w,x[1],amt(x),new Set(path).add(x[0]),false,x[0])).join("")).join("")}
open??=k.hidden;k.hidden=n.querySelector(":scope>.fl").hidden=!open;b.setAttribute("aria-expanded",open)}
const centre=()=>$("fcanvas").querySelector(".fc.root").scrollIntoView({block:"center",inline:"end"});
function openFlow(way,title,need,from){hidePop();REG=[];opener=from;$("ft").textContent="How to make "+title;$("frep").href=issueUrl(title);
$("fcanvas").innerHTML=nodeHtml(way,title,need,new Set([rootKey(way)]),true);expand($("fcanvas").firstChild,true);
$("flow").hidden=false;document.body.style.overflow="hidden";centre();$("fbk").focus()}

// open every branch a few levels deep; capped so drink chains with many alternatives stay usable
$("fe").onclick=()=>{for(let d=0;d<6&&REG.length<500;d++)$("fcanvas").querySelectorAll('.fx[aria-expanded="false"]').forEach(b=>REG.length<500&&expand(b.closest(".fn"),true));centre()};

// ingredient popover: hover, focus or tap an underlined ingredient
const pop=$("pop");let popFor=null,hideT=0;
function showPop(el){clearTimeout(hideT);const r=el.getBoundingClientRect(),key=el.dataset.key,name=el.textContent;popFor=el;POPW=[];
pop.innerHTML=`<p class="ph">How to get ${E(name)}</p>`+ways(key).map(w=>card(w,name,{ctx:"pop",key})).join("");pop.hidden=false;pop.scrollTop=0;
const w=pop.offsetWidth,h=pop.offsetHeight;let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);pop.style.left=x+"px";pop.style.top=y+"px"}
function hidePop(){pop.hidden=true;popFor=null}
const noHover=matchMedia("(hover: none)");
document.addEventListener("mouseover",e=>{if(noHover.matches)return;const el=e.target.closest(".ing.k");
if(el&&!el.closest("#pop")){if(el!==popFor)showPop(el);else clearTimeout(hideT)}else if(e.target.closest("#pop"))clearTimeout(hideT);else if(popFor){clearTimeout(hideT);hideT=setTimeout(hidePop,250)}});
addEventListener("scroll",e=>{if(popFor&&!pop.contains(e.target))hidePop()},true);

function togglePrefs(open){open??=$("prefs").hidden;$("prefs").hidden=!open;$("pf").setAttribute("aria-expanded",open)}
document.addEventListener("click",e=>{const t=e.target;let b;
if(b=t.closest("#tabs button"))return show(b.dataset.tab);
if(b=t.closest(".st")){if(b.dataset.pw){const[w,ti]=POPW[b.dataset.pw];return openFlow(w,ti,"",popFor)}const i=ALL[b.dataset.id];return openFlow(i.way,i.name,i.method=="Drink"?curSetup(i.way[1].id).T+"u":"",b)}
if(b=t.closest(".lk"))return copyLink(ALL[b.dataset.link]);
if(b=t.closest(".fx"))return expand(b.closest(".fn"));
if(b=t.closest(".star")){const id=b.dataset.fav,on=!favs.has(id);on?favs.add(id):favs.delete(id);save("favs",[...favs]);document.querySelectorAll(".star").forEach(s=>s.dataset.fav==id&&s.setAttribute("aria-pressed",on));return}
if(b=t.closest(".chip[data-m]")){meth.has(b.dataset.m)?meth.delete(b.dataset.m):meth.add(b.dataset.m);chips();return draw()}
if(b=t.closest(".chip[data-i]")){ingSel.has(b.dataset.i)?ingSel.delete(b.dataset.i):ingSel.add(b.dataset.i);ilist();return draw()}
if(t.id=="rs"){done={};save("done",done);return list()}
if(b=t.closest(".ing.k")){e.preventDefault();return popFor===b?hidePop():showPop(b)}
if(t.closest("#pf"))return togglePrefs();
if(!t.closest("#pop"))hidePop();if(!t.closest("#prefs"))togglePrefs(false)});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){if(!pop.hidden)return hidePop();if(!$("prefs").hidden)return togglePrefs(false);if(!$("flow").hidden)return closeFlow()}
if((e.key=="Enter"||e.key==" ")&&e.target.matches?.(".ing.k")){e.preventDefault();showPop(e.target)}});
$("fb").onclick=()=>{const open=$("fb").getAttribute("aria-expanded")!="true";$("fb").setAttribute("aria-expanded",open);$("fpanel").hidden=!open};
$("fclr").onclick=()=>{meth.clear();ingSel.clear();$("d").value=$("g").value="";chips();ilist();draw()};
let qT=0;$("q").oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>RENDER[tab](),120)};$("iq").oninput=ilist;["d","g","sort","gm"].forEach(i=>$(i).onchange=draw);$("ff").onchange=()=>RENDER[tab]();
$("prefs").onchange=e=>{const t=e.target;if(t.name=="th")prefs.theme=t.value;if(t.name=="tu")prefs.temp=t.value;save("prefs",prefs);applyTheme();RENDER[tab]()};
(document.querySelector(`input[name=th][value="${prefs.theme}"]`)||$("th0")).checked=true;(document.querySelector(`input[name=tu][value="${prefs.temp}"]`)||$("tu0")).checked=true;
const REPO="https://github.com/Squagg/starlight-recipes";
const issueUrl=name=>REPO+"/issues/new?title="+encodeURIComponent("Mistake: "+name)+"&body="+encodeURIComponent("Item: "+name+"\nPage: "+location.href+"\n\nWhat is wrong, and what should it be?\n");

function copyLink(i){try{history.replaceState(null,"","#"+i.tab+"/"+i.slug)}catch(e){}copyText(linkFor(i),"Link copied")}
function copyText(u,msg){

// #drinks or #drinks/white-russian: open that tab, clear anything hiding the item, then scroll to and highlight it

if(i){const go=()=>{const el=document.querySelector(`[data-card="${CSS.escape(i.id)}"]`);if(!el)return;el.scrollIntoView({block:"center"});return el},el=go();
if(el){el.classList.add("hit");setTimeout(go,250);setTimeout(()=>el.classList.remove("hit"),3000)}}return true}
