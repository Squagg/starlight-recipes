function anyOf(list){const sp=list.map(a=>ing(["e:"+a[1],a[0]]));if(!sp.length)return'<span class="m">nothing in the game qualifies right now</span>';
return sp.length<=6?sp.join(", "):sp.slice(0,6).join(", ")+` <details><summary>and ${sp.length-6} more</summary> ${sp.slice(6).join(", ")}</details>`}
let POPW=[];
// one recipe card; ctx is "grid" (star + steps), "flow" (expand button) or "pop" (steps button)
function card(way,title,c={}){const[t,o]=way;let body,side="";const li=inputs(way).map(x=>`<li>${ico(x[0])}<span>${E(amt(x))} ${ingName(x)}</span></li>`).join("");
if(t=="recipe"){body=`<ul>${li}</ul>`;side=`<span>${E(o.device=="Mixing"?"Mix":DEV[o.device]||o.device)}</span>${o.time?`<span>${o.time} sec</span>`:""}${o.temp?`<span>above ${fmtT(o.temp)}</span>`:""}`}
else if(t=="rx"){const pr=o.products.find(y=>y[0]==title)||o.products[0];body=SETUP[o.id]&&(c.ctx=="grid"||c.root)?setupHtml(o):`<ul>${li}</ul>`;side=`<span>${E(o.mix||"Mix")}</span><span>makes ${SETUP[o.id]&&(c.ctx=="grid"||c.root)?curSetup(o.id).T:pr[1]}u</span>${o.temp?`<span>above ${fmtT(o.temp)}</span>`:""}`}
else if(t=="cut"){const n=(o.outputs.find(y=>y[0]==title)||o.outputs[0])[1],also=o.outputs.filter(y=>y[0]!=title);
body=`<ol><li>Take ${ing(["e:"+o.inputId,o.input])}</li><li>${o.method=="Heat"?"Heat it to "+fmtT(o.temp):o.method=="Roll"?"Roll it with a rolling pin":"Cut it with a kitchen knife"}</li></ol>${also.length?`<p class="m">Also makes ${also.map(y=>y[1]+" "+E(y[0])).join(", ")}</p>`:""}`;side=n>1?`<span>makes ${n}</span>`:""}
else if(t=="seq"){body=`<ol><li>Take ${ing(["e:"+o.startId,o.start])}</li>${o.steps.map(s=>`<li>${s.k=="last"?"Finish with "+anyOf(s.any):s.k=="reagent"?`Add ${rng(s)}u ${ing(["r:"+s.id,s.name])}`:`Add ${rng(s)} ${s.any.length>1?"of any of: ":""}${anyOf(s.any)}`}</li>`).join("")}</ol>`;side="<span>Assemble</span>"}
else body=`<p>${t=="leaf"?"Get it: ":"Not stocked: "}${E(o)}</p>`;
const btn=c.ctx=="grid"?`<button class="star" type="button" data-fav="${E(c.id)}" aria-pressed="${favs.has(c.id)}" aria-label="Favourite ${E(title)}" title="Favourite">${STAR}</button><button class="st" type="button" data-id="${E(c.id)}" aria-label="Show how to make ${E(title)}" title="Show steps">${TREE}</button><button class="lk" type="button" data-link="${E(c.id)}" aria-label="Copy link to ${E(title)}" title="Copy link">${LINK}</button>`
:c.ctx=="flow"&&c.kids?`<button class="fx" type="button" aria-expanded="${!!c.root}" aria-label="Show how to make the ingredients of ${E(title)}" title="Show ingredients">${TREE}</button>`
:c.ctx=="pop"&&t!="leaf"&&t!="none"?`<button class="st" type="button" data-pw="${POPW.push([way,title])-1}" aria-label="Show how to make ${E(title)}" title="Show steps">${TREE}</button>`:"";
const key=c.key||(t=="recipe"||t=="seq"?"e:"+o.result:t=="rx"?"r:"+(o.products.find(y=>y[0]==title)||o.products[0])[2]:t=="cut"?"e:"+(o.outIds[o.outputs.findIndex(y=>y[0]==title)]||o.outIds[0]):"");
return`<div class="fc${c.root?" root":""}"${c.ctx=="grid"?` data-card="${E(c.id)}"`:""}><header><h4>${key?ico(key):""}${E(title)}${c.need?` <span class="badge">${E(c.need)}</span>`:""}</h4>${btn}</header><div class="fb"><div class="bd">${body}</div>${side?`<div class="side">${side}</div>`:""}</div></div>`}

const ITEMS=[...R.map(r=>({id:"R:"+r.id,way:["recipe",r],name:r.name,method:r.device=="Mixing"?"Mix":"Cook",device:r.device,group:r.group})),
...P.map((p,i)=>({id:"P:"+i,way:["cut",p],name:p.outputs[0][0],method:p.method})),...SQ.map(s=>({id:"S:"+s.id,way:["seq",s],name:s.name,method:"Assemble"}))];
const DRINKS=RX.filter(x=>x.drink).map(x=>({id:"D:"+x.id,way:["rx",x],name:x.name,method:"Drink"}));
const ALL={},INGS={},BYSLUG={recipes:{},drinks:{}};
const slug=s=>s.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
for(const[t,L]of[["recipes",ITEMS],["drinks",DRINKS]])for(const i of L){let s=slug(i.name)||"item",n=2;while(BYSLUG[t][s])s=slug(i.name)+"-"+n++;i.slug=s;i.tab=t;BYSLUG[t][s]=i}
for(const i of[...ITEMS,...DRINKS]){ALL[i.id]=i;i.ins=inputs(i.way);const xs=i.ins.map(x=>[x[0],x[1]]);if(i.way[0]=="seq")i.way[1].steps.forEach(s=>(s.any||[]).forEach(a=>xs.push(["e:"+a[1],a[0]])));
i.keys=new Set(xs.map(x=>x[0]));i.text=(i.name+" "+xs.map(x=>x[1]).join(" ")).toLowerCase();if(i.method!="Drink")xs.forEach(x=>INGS[x[0]]??=x[1])}
const INGL=Object.entries(INGS).sort((a,b)=>a[1].localeCompare(b[1]));

// recipes tab: filters, sort, grouping
const meth=new Set(),ingSel=new Set();
for(const[k,s,v]of[["device","d",i=>i.device!="Mixing"],["group","g",()=>1]])[...new Set(R.filter(v).map(r=>r[k]))].sort().forEach(x=>$(s).add(new Option(k=="device"?DEV[x]||x:x,x)));
function chips(){$("mchips").innerHTML=ORDER.map(m=>`<button type="button" class="chip" data-m="${m}" aria-pressed="${meth.has(m)}">${m} <span class="m">${ITEMS.filter(i=>i.method==m).length}</span></button>`).join("")}
function ilist(){const q=$("iq").value.trim().toLowerCase(),sel=INGL.filter(x=>ingSel.has(x[0])),rest=INGL.filter(x=>!ingSel.has(x[0])&&(!q||x[1].toLowerCase().includes(q)));
$("ilist").innerHTML=[...sel,...rest.slice(0,160)].map(x=>`<button type="button" class="chip" data-i="${E(x[0])}" aria-pressed="${ingSel.has(x[0])}">${E(x[1])}</button>`).join("")+(rest.length>160?`<span class="m">${rest.length-160} more, type to narrow</span>`:"")}
function draw(){const q=$("q").value.trim().toLowerCase(),d=$("d").value,g=$("g").value,a=$("sort").value=="a",gm=$("gm").checked,ff=$("ff").checked;
const L=ITEMS.filter(i=>(!meth.size||meth.has(i.method))&&(!d||i.device==d)&&(!g||i.group==g)&&(!q||i.text.includes(q))&&[...ingSel].every(k=>i.keys.has(k)));
const fv=i=>favs.has(i.id)?0:1,mo=i=>ORDER.indexOf(i.method);
L.sort((x,y)=>(gm?mo(x)-mo(y):0)||(ff?fv(x)-fv(y):0)||(!gm&&!a?mo(x)-mo(y):0)||x.name.localeCompare(y.name));
const nf=meth.size+ingSel.size+!!d+!!g;$("fclr").hidden=!nf;$("fb").textContent=nf?`Filter (${nf})`:"Filter";
$("n").textContent=L.length==ITEMS.length?`Showing all ${L.length} recipes.`:`Showing ${L.length} of ${ITEMS.length} recipes.`;
let h="",last;for(const i of L){if(gm&&i.method!=last){last=i.method;h+=`<h2 class="sec">${E(LBL[last])}</h2>`}h+=card(i.way,i.name,{ctx:"grid",id:i.id})}
$("grid").innerHTML=h||`<p class="m full">No recipes match. Try removing a filter.</p>`}
function drinks(){const q=$("q").value.trim().toLowerCase(),ff=$("ff").checked,L=DRINKS.filter(i=>!q||i.text.includes(q)).sort((x,y)=>(ff?favs.has(y.id)-favs.has(x.id):0)||x.name.localeCompare(y.name));
$("n").textContent=`Showing ${L.length} of ${DRINKS.length} drinks.`;$("drinks").innerHTML=L.map(i=>card(i.way,i.name,{ctx:"grid",id:i.id,need:curSetup(i.way[1].id).T+"u"})).join("")||`<p class="m full">No drinks match.</p>`}
function combos(){$("combos").innerHTML=`<p class="m full">Some foods take other items stacked onto them: hold the item and click the bottom bun, skewer or taco shell. The assembly recipes in the Recipes tab turn certain stacks into named dishes.</p>`+
CB.map(c=>`<section class="fc"><header><h4>${ing(["e:"+c.id,c.name])} takes up to ${c.max} of</h4></header><div class="cgrid">${c.accepts.map(a=>`<span>${ing(["e:"+a[1],a[0]])}</span>`).join("")}</div></section>`).join("")}
function menuCard(name,blurb,items){const t={};for(const i of items)for(const x of i.ins){(t[x[0]]??=[x[1],0,x[3]])[1]+=x[2]}
return`<section class="fc"><header><h4>${E(name)}</h4></header><div class="bd pad"><p class="m">${blurb}</p><ul>${items.map(i=>`<li>${ico(rootKey(i.way))}<span><b>${E(i.name)}</b> <span class="m">${E(i.way[0]=="recipe"?(i.way[1].device=="Mixing"?"Mix":DEV[i.way[1].device]||i.way[1].device):i.method)} · ${i.ins.map(x=>E(amt(x))+" "+E(x[1])).join(", ")}</span></span></li>`).join("")}</ul>
<p class="m"><b>Shopping list for one of each:</b> ${Object.values(t).sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]+(x[2]||"×")+" "+E(x[0])).join(", ")}</p></div></section>`}
function menus(){const fav=[...favs].map(id=>ALL[id]).filter(Boolean);
$("menus").innerHTML=(fav.length?menuCard("Your favourites","Everything you starred, with one shopping list. Stars are kept in this browser.",fav):`<section class="fc"><header><h4>Your favourites</h4></header><div class="bd pad"><p class="m">Star any recipe or drink and it collects here with a combined shopping list.</p></div></section>`)
+M.map(m=>menuCard(m.name,E(m.blurb),m.ids.map(i=>ALL["R:"+i]).filter(Boolean))).join("")}
function list(){const cb=(k,l)=>`<label><input type="checkbox" data-k="${E(k)}"${done[k]?" checked":""}> ${l}</label>`;
$("list").innerHTML=`<p class="m full">Prep checklist for shift start. Tick as you go (kept in this browser). <button id="rs" type="button">Clear ticks</button></p><section class="fc full"><header><h4>Tools first</h4></header><div class="bd pad">${TL.map(t=>`${E(t[0])} ← ${E(t[1])}`).join(" · ")}</div></section>`+
PT.map(t=>`<section class="fc"><header><h4>${E(t.name)}</h4></header><div class="bd pad">${t.stock.length?`<p class="m">Already stocked: ${E(t.stock.join(", "))}</p>`:""}<ul class="chk">${t.device?`<li>${cb(t.id,"Make"+(t.device=="Mixing"?" (mix in a beaker or bowl)":" ("+E(t.device)+")"))}<ul>${t.ins.map(x=>`<li class="m">${x[1]}${x[2]} ${E(x[0])}${x[3]?" ← "+E(x[3]):""}</li>`).join("")}</ul></li>`:""}
${t.then.map((c,i)=>`<li style="margin-left:${c.depth*14}px">${cb(t.id+"."+i,(c.tool=="Heat"?"Heat to "+fmtT(c.temp):E(c.tool))+": "+E(c.input)+" → "+c.outputs.map(o=>o[1]+"× "+E(o[0])).join(", "))}</li>`).join("")}</ul></div></section>`).join("")}
$("list").onchange=e=>{if(e.target.dataset.k){done[e.target.dataset.k]=e.target.checked;save("done",done)}};

// tabs
const RENDER={recipes:draw,drinks,combos,menus,list},VIEW={recipes:"grid",drinks:"drinks",combos:"combos",menus:"menus",list:"list"};
function show(t,keepHash){tab=t;if(!keepHash)try{history.replaceState(null,"","#"+t)}catch(e){}document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab==t));for(const k in VIEW)$(VIEW[k]).hidden=k!=t;
const searchable=t=="recipes"||t=="drinks";$("bar").hidden=$("n").hidden=!searchable;$("rctl").hidden=t!="recipes";$("batch").hidden=t!="drinks";$("fpanel").hidden=t!="recipes"||$("fb").getAttribute("aria-expanded")!="true";RENDER[t]()}

// steps page: a right-to-left tree of cards
let REG=[],opener=null;
const rootKey=([t,o])=>t=="rx"?"r:"+o.products[0][2]:t=="cut"?"e:"+o.outIds[0]:"e:"+o.result;
// in a build tree, a drink made as an ingredient is scaled to exactly the amount the next step needs
const fit=(way,need)=>{const m=/^([\d.]+)u$/.exec(need||"");if(way[0]!="rx"||!m)return way;const o=way[1],pr=o.products.find(y=>y[0]==way[2])||o.products[0],k=+m[1]/pr[1],r=v=>Math.round(v*k*100)/100;
return["rx",{...o,products:o.products.map(y=>[y[0],r(y[1]),y[2]]),reagents:o.reagents.map(y=>[y[0],r(y[1]),y[2]])}]};
function nodeHtml(way,title,need,path,root,key){way=fit(way,need);const i=REG.push({way,path})-1,kids=inputs(way).some(x=>!path.has(x[0]));
return`<div class="fn" data-i="${i}"><div class="fk" hidden></div><div class="fl" hidden><span>Made with</span><svg width="56" height="10" viewBox="0 0 56 10" aria-hidden="true"><path d="M0 5H54M48 1L54 5L48 9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>${card(way,title,{ctx:"flow",need,root,kids,key})}</div>`}
function expand(n,open){const k=n.querySelector(":scope>.fk"),b=n.querySelector(":scope>.fc .fx");if(!b)return;
if(!k.innerHTML){const{way,path}=REG[n.dataset.i];k.innerHTML=inputs(way).filter(x=>!path.has(x[0])).map(x=>ways(x[0]).map(w=>nodeHtml(w,x[1],amt(x),new Set(path).add(x[0]),false,x[0])).join("")).join("")}
open??=k.hidden;k.hidden=n.querySelector(":scope>.fl").hidden=!open;b.setAttribute("aria-expanded",open)}
const centre=()=>$("fcanvas").querySelector(".fc.root").scrollIntoView({block:"center",inline:"end"});
function openFlow(way,title,need,from){hidePop();REG=[];opener=from;$("ft").textContent="How to make "+title;$("frep").href=issueUrl(title);
$("fcanvas").innerHTML=nodeHtml(way,title,need,new Set([rootKey(way)]),true);expand($("fcanvas").firstChild,true);
$("flow").hidden=false;document.body.style.overflow="hidden";centre();$("fbk").focus()}
function closeFlow(){$("flow").hidden=true;document.body.style.overflow="";opener?.isConnected&&opener.focus()}
$("fbk").onclick=closeFlow;
// open every branch a few levels deep; capped so drink chains with many alternatives stay usable
$("fe").onclick=()=>{for(let d=0;d<6&&REG.length<500;d++)$("fcanvas").querySelectorAll('.fx[aria-expanded="false"]').forEach(b=>REG.length<500&&expand(b.closest(".fn"),true));centre()};

// ingredient popover: hover, focus or tap an underlined ingredient
const pop=$("pop");let popFor=null,hideT=0;
function showPop(el){clearTimeout(hideT);const r=el.getBoundingClientRect(),key=el.dataset.key,name=el.textContent;popFor=el;POPW=[];
pop.innerHTML=`<p class="ph">How to get ${E(name)}</p>`+ways(key).map(w=>card(w,name,{ctx:"pop",key})).join("");pop.hidden=false;pop.scrollTop=0;
const w=pop.offsetWidth,h=pop.offsetHeight;let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);pop.style.left=x+"px";pop.style.top=y+"px"}
function hidePop(){pop.hidden=true;popFor=null}
const noHover=matchMedia("(hover: none)");
document.addEventListener("mouseover",e=>{if(noHover.matches)return;const el=e.target.closest(".ing.k");
if(el&&!el.closest("#pop")){if(el!==popFor)showPop(el);else clearTimeout(hideT)}else if(e.target.closest("#pop"))clearTimeout(hideT);else if(popFor){clearTimeout(hideT);hideT=setTimeout(hidePop,250)}});
addEventListener("scroll",e=>{if(popFor&&!pop.contains(e.target))hidePop()},true);

function togglePrefs(open){open??=$("prefs").hidden;$("prefs").hidden=!open;$("pf").setAttribute("aria-expanded",open)}
document.addEventListener("click",e=>{const t=e.target;let b;
if(b=t.closest("#tabs button"))return show(b.dataset.tab);
if(b=t.closest(".st")){if(b.dataset.pw){const[w,ti]=POPW[b.dataset.pw];return openFlow(w,ti,"",popFor)}const i=ALL[b.dataset.id];return openFlow(i.way,i.name,i.method=="Drink"?curSetup(i.way[1].id).T+"u":"",b)}
if(b=t.closest(".lk"))return copyLink(ALL[b.dataset.link]);
if(b=t.closest(".fx"))return expand(b.closest(".fn"));
if(b=t.closest(".star")){const id=b.dataset.fav,on=!favs.has(id);on?favs.add(id):favs.delete(id);save("favs",[...favs]);document.querySelectorAll(".star").forEach(s=>s.dataset.fav==id&&s.setAttribute("aria-pressed",on));return}
if(b=t.closest(".chip[data-m]")){meth.has(b.dataset.m)?meth.delete(b.dataset.m):meth.add(b.dataset.m);chips();return draw()}
if(b=t.closest(".chip[data-i]")){ingSel.has(b.dataset.i)?ingSel.delete(b.dataset.i):ingSel.add(b.dataset.i);ilist();return draw()}
if(t.id=="rs"){done={};save("done",done);return list()}
if(b=t.closest(".ing.k")){e.preventDefault();return popFor===b?hidePop():showPop(b)}
if(t.closest("#pf"))return togglePrefs();
if(!t.closest("#pop"))hidePop();if(!t.closest("#prefs"))togglePrefs(false)});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){if(!pop.hidden)return hidePop();if(!$("prefs").hidden)return togglePrefs(false);if(!$("flow").hidden)return closeFlow()}
if((e.key=="Enter"||e.key==" ")&&e.target.matches?.(".ing.k")){e.preventDefault();showPop(e.target)}});
$("fb").onclick=()=>{const open=$("fb").getAttribute("aria-expanded")!="true";$("fb").setAttribute("aria-expanded",open);$("fpanel").hidden=!open};
$("fclr").onclick=()=>{meth.clear();ingSel.clear();$("d").value=$("g").value="";chips();ilist();draw()};
let qT=0;$("q").oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>RENDER[tab](),120)};$("iq").oninput=ilist;["d","g","sort","gm"].forEach(i=>$(i).onchange=draw);$("ff").onchange=()=>RENDER[tab]();
$("prefs").onchange=e=>{const t=e.target;if(t.name=="th")prefs.theme=t.value;if(t.name=="tu")prefs.temp=t.value;save("prefs",prefs);applyTheme();RENDER[tab]()};
(document.querySelector(`input[name=th][value="${prefs.theme}"]`)||$("th0")).checked=true;(document.querySelector(`input[name=tu][value="${prefs.temp}"]`)||$("tu0")).checked=true;
const REPO="https://github.com/Squagg/starlight-recipes";
const issueUrl=name=>REPO+"/issues/new?title="+encodeURIComponent("Mistake: "+name)+"&body="+encodeURIComponent("Item: "+name+"\nPage: "+location.href+"\n\nWhat is wrong, and what should it be?\n");
const linkFor=i=>location.origin+location.pathname+"#"+i.tab+"/"+i.slug;
let toastT=0;function toast(m){$("toast").textContent=m;$("toast").hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$("toast").hidden=true,1800)}
function copyLink(i){const u=linkFor(i);try{history.replaceState(null,"","#"+i.tab+"/"+i.slug)}catch(e){}
const done=()=>toast("Link copied"),fail=()=>{const a=document.createElement("textarea");a.value=u;a.style.position="fixed";a.style.opacity="0";document.body.append(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?"Link copied":"Copy this link from the address bar")};
navigator.clipboard?.writeText(u).then(done,fail)??fail()}
// #drinks or #drinks/white-russian: open that tab, clear anything hiding the item, then scroll to and highlight it
function route(){const[t,s]=decodeURIComponent(location.hash.slice(1)).split("/");if(!VIEW[t])return false;const i=s&&BYSLUG[t]?.[s];
if(i){$("q").value="";if(t=="recipes"){meth.clear();ingSel.clear();$("d").value=$("g").value="";chips();ilist()}}show(t,true);
if(i){const go=()=>{const el=document.querySelector(`[data-card="${CSS.escape(i.id)}"]`);if(!el)return;el.scrollIntoView({block:"center"});return el},el=go();
if(el){el.classList.add("hit");setTimeout(go,250);setTimeout(()=>el.classList.remove("hit"),3000)}}return true}
addEventListener("hashchange",route);
$("batch").value=prefs.batch||"";$("batch").onchange=()=>{prefs.batch=+$("batch").value||0;save("prefs",prefs);RENDER[tab]()};
$("dd").textContent=new Date(DATA_DATE+"T12:00").toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
applyTheme();chips();ilist();route()||show("recipes",true);
</script>
</body></html>
